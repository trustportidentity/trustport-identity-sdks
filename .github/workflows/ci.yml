name: CI & SOC2 Compliance

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: identity-sdks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Gate 1: TypeScript / Node SDKs ──────────────────────────────────────────
  test-node-sdks:
    name: Node, JS & Expo SDKs (Test & Lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and test Node SDK
        run: |
          cd sdks/node
          npm ci
          npm run build
          npm test

      - name: Build and test JS/React SDK
        run: |
          cd sdks/js
          npm ci
          npm run build
          npm test

      - name: Build and test Expo SDK
        run: |
          cd sdks/expo
          npm ci
          npm run build
          npm test

  # ─── Gate 2: Python SDK ──────────────────────────────────────────────────────
  test-python-sdk:
    name: Python SDK (Test & Lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install and test Python SDK
        run: |
          cd sdks/python
          pip install --upgrade pip
          pip install -e '.[test]'
          pytest

  # ─── Gate 3: .NET SDK ────────────────────────────────────────────────────────
  test-dotnet-sdk:
    name: .NET SDK (Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build .NET solutions
        run: |
          cd sdks/dotnet
          dotnet build --configuration Release

  # ─── Gate 4: Security & SOC2 CVE Audit ───────────────────────────────────────
  security-audit:
    name: CVE Vulnerability Scan & Secret Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner (CVEs across all SDKs)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Secret Scan (Credentials & API Keys)
        run: |
          if grep -rn \
            -e 'password\s*=\s*"[^"]\+"' \
            -e 'private_key\s*=\s*"[^"]\+"' \
            -e 'AIza[0-9A-Za-z-_]{35}' \
            --include="*.ts" \
            --include="*.js" \
            --include="*.py" \
            --include="*.cs" \
            --include="*.php" \
            --include="*.swift" \
            --exclude-dir=".git" \
            --exclude-dir="node_modules" \
            --exclude-dir="dist" \
            --exclude-dir="tests" \
            --exclude-dir="test" \
            --exclude-dir=".venv" \
            .; then
            echo "❌ Hardcoded secret pattern detected"
            exit 1
          fi
          echo "✅ No hardcoded secrets detected"

  # ─── Gate 5: SOC2 Compliance & Verification Pass ─────────────────────────────
  soc2-verification-passed:
    name: SOC2 Verification & Flow Check
    runs-on: ubuntu-latest
    needs: [test-node-sdks, test-python-sdk, test-dotnet-sdk, security-audit]
    if: always()
    steps:
      - name: Enforce All SOC2 Gates Passed
        run: |
          if [ "${{ needs.test-node-sdks.result }}" != "success" ] || \
             [ "${{ needs.test-python-sdk.result }}" != "success" ] || \
             [ "${{ needs.test-dotnet-sdk.result }}" != "success" ] || \
             [ "${{ needs.security-audit.result }}" != "success" ]; then
            echo "❌ SOC2 compliance check failed: All test, security, and CVE scan gates must pass."
            exit 1
          fi
          echo "✅ All SOC2 security, CVE scan, and SDK test gates passed successfully."

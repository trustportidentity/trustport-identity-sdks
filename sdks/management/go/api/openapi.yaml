    post:
      operationId: createRole
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleInput"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleEnvelope"
          description: Created.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Error. `error.code` is one of NOT_FOUND, UNAUTHORIZED, FORBIDDEN,\
            \ CONFLICT, BAD_REQUEST, VALIDATION_ERROR, RATE_LIMITED, INTERNAL and\
            \ similar."
      summary: Create a role
      tags:
      - Roles
  /api/v1/roles/{roleId}:
    delete:

          application/json:
            schema:
              $ref: "#/components/schemas/AssignRoleInput"
        required: true
      responses:
        "204":
          description: Assigned.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Error. `error.code` is one of NOT_FOUND, UNAUTHORIZED, FORBIDDEN,\
            \ CONFLICT, BAD_REQUEST, VALIDATION_ERROR, RATE_LIMITED, INTERNAL and\
            \ similar."
      summary: Assign a role to a user (optionally until a date). Only an owner can
        grant ownership.
      tags:
      - Roles
  /api/v1/roles/revoke:
    post:
      operationId: revokeRole
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeRoleInput"

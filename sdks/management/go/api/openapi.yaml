openapi: 3.0.3
info:
  description: |
    Manage users, roles, groups, organizations, applications (OAuth clients), API keys, invitations and custom domains of a TrustPort Identity tenant.

    Authenticate with `Authorization: Bearer <token>` where the token is either a user access token or a **secret API key** (`sk_live_…` / `sk_test_…`).
    Single objects are wrapped as `{ "data": ... }`; the users list also carries paging fields at the top level.
  title: TrustPort Identity Management API
  version: 0.1.0
servers:
- description: Production gateway
  url: https://id.trustportidentity.com
- description: Local gateway
  url: http://localhost:8080
security:
- bearerAuth: []
tags:
- name: Users
- name: Roles
- name: Groups
- name: Organizations
- name: Applications
- name: ApiKeys
- name: Invitations
- name: Domains
paths:
  /api/v1/users:
    get:
      operationId: listUsers
      parameters:
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
        style: form
      - explode: true
        in: query
        name: per_page
        required: false
        schema:
          default: 20
          minimum: 1
          type: integer
        style: form
      - description: "Searches username, email, first and last name."
        explode: true
        in: query
        name: q
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: status
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
          description: A page of users.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Error. `error.code` is one of NOT_FOUND, UNAUTHORIZED, FORBIDDEN,\
            \ CONFLICT, BAD_REQUEST, VALIDATION_ERROR, RATE_LIMITED, INTERNAL and\
            \ similar."
      summary: List users
      tags:
      - Users
    post:
      operationId: createUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserInput"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
          description: Created.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Error. `error.code` is one of NOT_FOUND, UNAUTHORIZED, FORBIDDEN,\
            \ CONFLICT, BAD_REQUEST, VALIDATION_ERROR, RATE_LIMITED, INTERNAL and\
            \ similar."
      summary: Create a user
      tags:
      - Users
  /api/v1/users/{userId}:
    delete:
      operationId: deleteUser
      parameters:
      - explode: false
        in: path
        name: userId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "204":
          description: Deleted.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Error. `error.code` is one of NOT_FOUND, UNAUTHORIZED, FORBIDDEN,\
            \ CONFLICT, BAD_REQUEST, VALIDATION_ERROR, RATE_LIMITED, INTERNAL and\
            \ similar."
      summary: Delete a user (soft delete; sessions are revoked)
      tags:
      - Users
    get:
      operationId: getUser
      parameters:
      - explode: false
        in: path
        name: userId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
          description: The user.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Error. `error.code` is one of NOT_FOUND, UNAUTHORIZED, FORBIDDEN,\
            \ CONFLICT, BAD_REQUEST, VALIDATION_ERROR, RATE_LIMITED, INTERNAL and\
            \ similar."
      summary: Get a user
      tags:
      - Users
    patch:
      description: "Setting `is_active` to false also revokes the user's live sessions.\
        \ Only an owner can deactivate an owner, and the last owner cannot be removed."
      operationId: updateUser
      parameters:
      - explode: false
        in: path
        name: userId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserInput"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
          description: Updated.
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Error. `error.code` is one of NOT_FOUND, UNAUTHORIZED, FORBIDDEN,\
            \ CONFLICT, BAD_REQUEST, VALIDATION_ERROR, RATE_LIMITED, INTERNAL and\
            \ similar."
      summary: Update a user (only the fields you send change)
      tags:
      - Users
  /api/v1/users/{userId}/roles:

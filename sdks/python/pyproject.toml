[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trustport-identity"
version = "0.1.0"
description = "TrustPort Identity SDK for Python: OIDC login (code + PKCE), token verification, FastAPI and Flask helpers"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["httpx>=0.27", "PyJWT[crypto]>=2.9"]

[project.optional-dependencies]
fastapi = ["fastapi>=0.110"]
flask = ["flask>=3.0"]
test = ["pytest>=8", "fastapi>=0.110", "flask>=3.0", "cryptography>=43"]

[tool.setuptools]
packages = ["trustport_identity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
